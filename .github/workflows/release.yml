name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar pacotes (zip e tar.gz)
        run: |
          VERSION="${{ github.event.release.tag_name || 'v1.0.0' }}"
          NAME="canil-patas-unidas-${VERSION}"
          mkdir -p dist
          zip -r "dist/${NAME}.zip" . -x ".git/*" ".github/*" "dist/*"
          tar --exclude=".git" --exclude=".github" --exclude="dist" \
              -czf "dist/${NAME}.tar.gz" .

      - name: Anexar pacotes na release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || 'v1.0.0' }}
          files: dist/*
